[versions]
activityCompose = "1.13.0"
agp = "9.2.1"
appcompat = "1.7.1"
appMetrica = "8.3.0"
caoc = "2.4.0"
chucker = "4.3.1"
coil = "3.4.0"
composeAnimation = "1.11.2"
composeFoundation = "1.11.2"
composeMaterialNavigation = "1.11.2"
composeRuntime = "1.11.2"
composeUi = "1.11.2"
coreKtx = "1.19.0"
coroutine = "1.11.0"
dagger = "2.59.2"
datastore = "1.2.1"
detekt = "1.23.8"
jacoco = "0.8.11"
javalite = "4.35.0"
junit = "6.1.0"
kotestAssertion = "6.1.11"
kotlin = "2.4.0"
kotlinxSerialization = "1.11.0"
kover = "0.9.8"
ksp = "2.3.9"
ktlint = "1.2.1"
ktlintGradle = "14.2.0"
lifecycleRuntime = "2.10.0"
material3 = "1.4.0"
mockK = "1.14.11"
navigationCompose = "2.9.8"
ok2curl = "0.8.0"
okhttp = "5.3.2"
paging = "3.5.0"
protobuf = "0.10.0"
retrofit = "3.0.0"
room = "2.8.4"
splashscreen = "1.2.0"
telephoto = "0.19.0"
turbine = "1.2.1"

[libraries]
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
appMetrica = { module = "io.appmetrica.analytics:analytics", version.ref = "appMetrica" }
caoc = { group = "cat.ereza", name = "customactivityoncrash", version.ref = "caoc" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
chuckerNoOp = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilOkHttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
composeAnimation = { module = "androidx.compose.animation:animation", version.ref = "composeAnimation" }
composeFoundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeFoundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntime" }
composeUi = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
composeUiGraphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
composeUiManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
coroutine = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutine" }
coroutineTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutine" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
daggerCompiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kotestAssertion = { module = "io.kotest:kotest-assertions-core", version.ref = "kotestAssertion" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
materialNavigation = { module = "androidx.compose.material:material-navigation", version.ref = "composeMaterialNavigation" }
mockK = { module = "io.mockk:mockk", version.ref = "mockK" }
navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
ok2curl = { module = "com.github.mrmike:ok2curl", version.ref = "ok2curl" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttpLoggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
pagingCommonKtx = { module = "androidx.paging:paging-common-ktx", version.ref = "paging" }
pagingCompose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
pagingRuntimektx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
pagingTest = { module = "androidx.paging:paging-testing", version.ref = "paging" }
protobufJavalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "javalite" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitKotlinxSerializationConverter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
roomKtx = { module = "androidx.room:room-ktx", version.ref = "room" }
roomPaging = { module = "androidx.room:room-paging", version.ref = "room" }
roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
telephoto = { module = "me.saket.telephoto:zoomable-image-coil", version.ref = "telephoto" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }

[bundles]
coil = ["coilCompose", "coilOkHttp"]
compose = ["composeAnimation", "composeFoundation", "composeUi", "composeRuntime", "composeUiGraphics", "composeUiToolingPreview"]
datastore = ["datastore", "protobufJavalite"]
okhttp = ["okhttp", "okhttpLoggingInterceptor"]
paging = ["pagingCommonKtx", "pagingCompose", "pagingRuntimektx"]
room = ["roomKtx", "roomPaging", "roomRuntime"]
